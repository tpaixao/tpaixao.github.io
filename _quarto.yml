project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*.md"
  post-render:
    - _post_render.py

website:
  title: "Tiago Paixão"
  site-url: https://tiagopaixao.com
  favicon: assets/favicon.png
  search: true
  navbar:
    background: light
    foreground: dark
    pinned: true
    right:
      - blog.qmd
      - publications.qmd
      - href: about.qmd
        text: About
format:
  html:
    theme:
      - litera
      - theme-litera-custom.scss
    css: styles.css
    toc: false


