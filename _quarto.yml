project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*.md"
    - "*.ipynb"
  post-render:
    - _post_render.py

execute:
  freeze: auto
  cache: true

website:
  title: "Tiago Paixão"
  site-url: https://tiagopaixao.com
  # Render draft: true posts with full content + a Draft banner instead of the
  # default blank stub; drafts stay unlinked (excluded from listing, search,
  # sitemap, navbar) so they are only reachable by direct URL.
  draft-mode: unlinked
  favicon: assets/favicon.png
  search: true
  navbar:
    background: light
    foreground: dark
    pinned: true
    right:
      - blog.qmd
      - publications.qmd
      - href: about.qmd
        text: About
format:
  html:
    theme:
      - litera
      - theme-litera-custom.scss
    css: styles.css
    toc: false


